<!DOCTYPE html>
<html lang="en">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        function logout() {
            $.ajax({
                url: 'adminSessionsReset.php',
                type: 'GET',
                success: function() {
                },
                error: function(xhr, status, error) {
                    alert("System Login Failiure !:"+error);
                    window.location.href="admin_login.html";
                    console.error('Error:', error);
                }
            });
        }
        $(document).ready(function(){
            $.ajax({
                url: "check_admin_login.php", // PHP script to call
                type: "GET", // or "POST" depending on your needs
                success: function(data){
                    // If the call is successful, update the content of the admin_dashboard div
                    logout();
                    console.log("Admin Logged In !");
                },
                error: function(xhr, status, error) {
                    // If there's an error, you can handle it here
                    window.location.href="admin_login.html";
                    console.error(xhr.responseText);
                }
            });
        });
        </script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            flex-direction: column; /* Added */
        }
        .contact-section {
            margin-bottom: 20px; /* Added */
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 20px; /* Added */
        }
        .card {
            width: 250px;
            margin: 20px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card h2 {
            margin-top: 0;
            padding: 15px;
            background-color: #007bff;
            color: #fff;
            text-align: center;
        }
        .card p {
            padding: 20px;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            margin-top: 20px; /* Added */
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        /* Input field styling */
        #sqlQuery {
            width: 400px;
        }
        /* Button styling */
        #executeSQL {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #executeSQL:hover {
            background-color: #0056b3;
        }
        .edit-delete-buttons {
            text-align: center;
        }
        .edit-delete-buttons button {
            margin: 5px;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .edit-button {
            background-color: #28a745;
            color: #fff;
        }
        .edit-button:hover {
            background-color: #218838;
        }
        .delete-button {
            background-color: #dc3545;

            background-color: #c82333;

</head>
<body>
    <nav>
        <img class="name" src="images/clothing.png"> 
        <ul class="sidebar"> 
            <li><a href="admin.html"><i class="fas fa-chart-bar"></i> Analytics</a></li>
            <li><a href="admin_users.html"><i class="fas fa-users"></i> Users</a></li>
            <li><a href="admin_payments.html"><i class="fas fa-money-bill-wave"></i> Payments</a></li>
            <li><a href="admin_cusRev.html"><i class="fas fa-comments"></i> Customer Reviews</a></li>
            <li><a href="admin_productRev.html" class="active"><i class="fas fa-comments"></i> Product Reviews</a></li>

            <li><a href="admin_signup.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>

    <div class="container">
        <div class="contact-section" id="sqlSection">
            <input type="text" id="sqlQuery" placeholder="Enter SQL command">
            <button id="executeSQL">Execute SQL</button>
        </div>
        <table id="userTable">
            <thead>
                <tr>
                    <th>id</th>
                    <th>product_name</th>
                    <th>rating</th>
                    <th>email</th>
                    <th>reviewer_name</th>
                    <th>review_title</th>
                    <th>comment</th>
                    <th>created_at</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userData">
                <!-- Data will be filled dynamically by JavaScript -->
            </tbody>
        </table>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            function executeSQLQuery(sqlQuery) {
                $.ajax({
                    type: "POST",
                    url: "user.php",
                    data: { sqlQuery: sqlQuery },
                    dataType: "json",
                    success: function(data){
                        console.log("Data received from server:", data);
                        $('#userData').empty();
                        $.each(data, function(index, user){
                            var row = '<tr>' +
                                '<td>' + user.id + '</td>' +
                                '<td>' + user.product_name + '</td>' +
                                '<td>' + user.rating + '</td>' +
                                '<td>' + user.email + '</td>' +
                                '<td>' + user.reviewer_name + '</td>' +
                                '<td>' + user.review_title + '</td>' +
                                '<td>' + user.comment + '</td>' +
                                '<td>' + user.created_at + '</td>' +
                                '<td class="edit-delete-buttons">' +
                                '<button class="edit-button" data-id="' + user.id + '">Edit</button>' +
                                '<button class="delete-button" data-id="' + user.id + '">Delete</button>' +
                                '</td>' +
                                '</tr>';
                            $('#userData').append(row);
                        });
                    },
                    error: function(xhr, status, error) {
                        console.error("Error fetching user data:", error);
                    }
                });
            }

            $('#executeSQL').click(function() {
                var sqlQuery = $('#sqlQuery').val().trim();
                if (sqlQuery !== '') {
                    executeSQLQuery(sqlQuery);
                }
            });

            executeSQLQuery("SELECT * FROM product_reviews");

            $(document).ready(function() {
            // Edit button click handler
            $('#userData').on('click', '.edit-button', function() {
                var revID = $(this).data('id');
                var newData = prompt('Enter new data:');
                if (newData !== null) {
                    $.ajax({
                        type: "POST",
                        url: "admin_productRev.php",
                        data: {
                            action: "edit", // Make sure "action" is included here
                            id: revID,
                            newData: newData
                        },
                        dataType: "json",
                        success: function(response) {
                            if (response.success) {
                                executeSQLQuery("SELECT * FROM product_reviews"); // Refresh data
                                alert(response.success);
                            } else {
                                alert(response.error);
                            }
                        },
                        error: function(xhr, status, error) {
                            console.error("Error updating record:", error);
                        }
                    });
                }
            });

            // Delete button click handler
            $('#userData').on('click', '.delete-button', function() {
                var revID = $(this).data('id');
                if (confirm('Are you sure you want to delete this record?')) {
                    $.ajax({
                        type: "POST",
                        url: "admin_productRev.php",
                        data: {
                            action: "delete",
                            id: revID
                        },
                        dataType: "json",
                        success: function(response) {
                            if (response.success) {
                                executeSQLQuery("SELECT * FROM product_reviews"); // Refresh data
                                alert(response.success);
                            } else {
                                alert(response.error);
                            }
                        },
                        error: function(xhr, status, error) {
                            console.error("Error deleting record:", error);
                        }
                    });
                }
            });
        });

        });

    </script>
</body>
</html>
